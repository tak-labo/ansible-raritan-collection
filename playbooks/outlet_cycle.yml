---
# Power cycle a specific outlet (power off then on).
# Note: state=cycle is always reported as changed=true because it is an action,
# not a declarative state. It executes unconditionally every run.
#
# Usage:
#   cp playbooks/vars.yml.example playbooks/vars.yml
#   vi playbooks/vars.yml   # set pdu_host, pdu_user, pdu_pass
#   ansible-playbook playbooks/outlet_cycle.yml
#
# You will be prompted for the outlet number.

- name: Power cycle outlet
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  vars_prompt:
    - name: outlet_number
      prompt: "Outlet number to cycle"
      private: false

  tasks:
    - name: Cycle outlet {{ outlet_number }}
      tak_55.raritan_xerus.outlet_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        outlet: "{{ outlet_number | int }}"
        state: cycle

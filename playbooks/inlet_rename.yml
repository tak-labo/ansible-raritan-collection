---
# Rename a specific inlet (sets the inlet's label/description).
#
# Prompts for inlet number (1-based) and a new name (up to ~64 characters).
# Idempotent: if name is already set, reports changed=false.
#
# Usage:
#   cp playbooks/vars.yml.example playbooks/vars.yml
#   vi playbooks/vars.yml   # set pdu_host, pdu_user, pdu_pass, validate_certs
#   ansible-playbook playbooks/inlet_rename.yml
#
# Prompted input:
#   - inlet_number: inlet to rename (integer, 1-based)
#   - inlet_name: new name (string, ~64 char limit)

- name: Rename inlet
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  vars_prompt:
    - name: inlet_number
      prompt: "Inlet number to rename"
      private: false
    - name: inlet_name
      prompt: "New inlet name"
      private: false

  tasks:
    - name: Rename inlet {{ inlet_number }}
      taklabo.raritan_xerus.inlet_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        inlet: "{{ inlet_number | int }}"
        name: "{{ inlet_name }}"

---
# Power on a specific outlet.
#
# Prompts for outlet number (1-based) and powers on that outlet.
# Idempotent: if outlet is already on, reports changed=false.
#
# Usage:
#   cp playbooks/vars.yml.example playbooks/vars.yml
#   vi playbooks/vars.yml   # set pdu_host, pdu_user, pdu_pass, validate_certs
#   ansible-playbook playbooks/outlet_on.yml
#
# Prompted input:
#   - outlet_number: outlet to power on (integer, 1-based)

- name: Power on outlet
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  vars_prompt:
    - name: outlet_number
      prompt: "Outlet number to power on"
      private: false

  tasks:
    - name: Power on outlet {{ outlet_number }}
      taklabo.raritan_xerus.outlet_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        outlet: "{{ outlet_number | int }}"
        state: on

---
# Create or update a PDU user account with SNMPv3 auth_priv enabled.
#
# Prompts for username and password, then creates or updates the account with:
# - SNMPv3 security level: auth_priv (authentication + encryption)
# - Authentication protocol: SHA-256
# - Privacy protocol: AES-128
# - Passphrase derivation: account password is used for both auth and priv
#
# Idempotent: if user exists with same credentials, reports changed=false.
# Requires PDU admin credentials (in playbooks/vars.yml).
#
# Usage:
#   cp playbooks/vars.yml.example playbooks/vars.yml
#   vi playbooks/vars.yml   # set pdu_host, pdu_user, pdu_pass, validate_certs
#   ansible-playbook playbooks/snmpv3_user.yml
#
# Prompted input:
#   - target_user: username to create (string)
#   - new_password: account password (string, used as both auth and priv passphrase)

- name: Create SNMPv3 user
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  vars_prompt:
    - name: target_user
      prompt: "Username to create"
      private: false
    - name: new_password
      prompt: "Password for the user"
      private: true
      confirm: true

  tasks:
    - name: Create user {{ target_user }} with SNMPv3
      taklabo.raritan_xerus.user_account:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        target_user: "{{ target_user }}"
        new_password: "{{ new_password }}"
        snmp_v3_enabled: true
        sec_level: auth_priv
        auth_protocol: sha256
        priv_protocol: aes128
        use_password_as_auth_passphrase: true
        use_auth_passphrase_as_priv_passphrase: true
        state: present

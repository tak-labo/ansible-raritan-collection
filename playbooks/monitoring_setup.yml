---
# Configure event monitoring: syslog action + SNMP trap action + event rule.
# All three tasks are idempotent — safe to run multiple times.
#
# This playbook wires up a complete event notification pipeline:
#   1. A syslog action (UDP to syslog server, port 514 by default)
#   2. An SNMP trap action (v2Trap to NMS, port 162 by default)
#   3. An event rule that triggers both actions on any PDU event (event_id: ["**"])
#
# Variables required in playbooks/vars.yml:
#   - syslog_action_name (string): name for the syslog action
#   - syslog_server (string): syslog server hostname or IP
#   - syslog_port (int, default: 514): UDP port for syslog
#   - snmp_trap_action_name (string): name for the SNMP trap action
#   - snmp_trap_dest_host (string): NMS/trap collector hostname or IP
#   - snmp_read_community (string): SNMP v2c community for traps
#   - event_rule_name (string): name for the event rule
#
# Usage:
#   cp playbooks/vars.yml.example playbooks/vars.yml
#   vi playbooks/vars.yml   # set all variables above
#   ansible-playbook playbooks/monitoring_setup.yml

- name: Set up PDU event monitoring
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Create syslog action
      taklabo.raritan_xerus.syslog_action:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ syslog_action_name }}"
        server: "{{ syslog_server }}"
        port: "{{ syslog_port }}"
        state: present

    - name: Create SNMP trap action
      taklabo.raritan_xerus.snmp_trap_action:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ snmp_trap_action_name }}"
        notification_type: v2Trap
        destinations:
          - host: "{{ snmp_trap_dest_host }}"
            port: 162
            community: "{{ snmp_read_community }}"
        state: present

    - name: Create event rule (fire both actions on any event)
      taklabo.raritan_xerus.event_rule:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ event_rule_name }}"
        action_names:
          - "{{ syslog_action_name }}"
          - "{{ snmp_trap_action_name }}"
        event_id: ["**"]
        match_type: both
        state: present

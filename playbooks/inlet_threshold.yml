---
# Set upper warning/critical alert thresholds on a specific inlet sensor.
#
# Prompts for inlet number, sensor type, and two threshold values.
# Idempotent: if thresholds are already set, reports changed=false.
#
# Supported sensors: voltage, current, active_power, apparent_power, frequency,
# power_factor, three_phase_apparent_power, three_phase_active_power,
# residual_current, neutral_current, total_power_factor, total_active_power,
# total_apparent_power, total_current
# (see inlet_config module reference for units and defaults).
#
# Setting a threshold automatically enables that threshold's alert.
# To disable without losing the stored value, use inlet_config's unset_thresholds.
#
# Usage:
#   cp playbooks/vars.yml.example playbooks/vars.yml
#   vi playbooks/vars.yml   # set pdu_host, pdu_user, pdu_pass, validate_certs
#   ansible-playbook playbooks/inlet_threshold.yml
#
# Prompted input:
#   - inlet_number: inlet to configure (integer, 1-based)
#   - sensor_name: sensor to threshold (string, default: voltage)
#   - threshold_upper_warning: alert level (float, in sensor units)
#   - threshold_upper_critical: alert level (float, in sensor units)

- name: Set inlet sensor thresholds
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  vars_prompt:
    - name: inlet_number
      prompt: "Inlet number"
      private: false
    - name: sensor_name
      prompt: "Sensor (e.g. voltage, current, active_power)"
      private: false
      default: voltage
    - name: threshold_upper_warning
      prompt: "Upper warning threshold value"
      private: false
    - name: threshold_upper_critical
      prompt: "Upper critical threshold value"
      private: false

  tasks:
    - name: Set thresholds on inlet {{ inlet_number }} sensor {{ sensor_name }}
      taklabo.raritan_xerus.inlet_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        inlet: "{{ inlet_number | int }}"
        sensor: "{{ sensor_name }}"
        upper_warning: "{{ threshold_upper_warning | float }}"
        upper_critical: "{{ threshold_upper_critical | float }}"

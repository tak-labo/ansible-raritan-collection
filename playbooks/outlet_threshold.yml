---
# Set upper warning/critical alert thresholds on a specific outlet sensor.
#
# Prompts for outlet number, sensor type, and two threshold values.
# Idempotent: if thresholds are already set, reports changed=false.
#
# Supported sensors: voltage, current, active_power, apparent_power, power_factor,
# maximum_current, inrush_current
# (see outlet_config module reference for units and defaults).
#
# Note: outlet sensors are a subset of inlet sensors; outlets lack the three-phase
# and residual-current sensors inlets have, but add maximum_current and inrush_current.
#
# Setting a threshold automatically enables that threshold's alert.
# To disable without losing the stored value, use outlet_config's unset_thresholds.
#
# Usage:
#   cp playbooks/vars.yml.example playbooks/vars.yml
#   vi playbooks/vars.yml   # set pdu_host, pdu_user, pdu_pass, validate_certs
#   ansible-playbook playbooks/outlet_threshold.yml
#
# Prompted input:
#   - outlet_number: outlet to configure (integer, 1-based)
#   - sensor_name: sensor to threshold (string, default: current)
#   - threshold_upper_warning: alert level (float, in sensor units)
#   - threshold_upper_critical: alert level (float, in sensor units)

- name: Set outlet sensor thresholds
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  vars_prompt:
    - name: outlet_number
      prompt: "Outlet number"
      private: false
    - name: sensor_name
      prompt: "Sensor (e.g. current, active_power)"
      private: false
      default: current
    - name: threshold_upper_warning
      prompt: "Upper warning threshold value"
      private: false
    - name: threshold_upper_critical
      prompt: "Upper critical threshold value"
      private: false

  tasks:
    - name: Set thresholds on outlet {{ outlet_number }} sensor {{ sensor_name }}
      taklabo.raritan_xerus.outlet_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        outlet: "{{ outlet_number | int }}"
        sensor: "{{ sensor_name }}"
        upper_warning: "{{ threshold_upper_warning | float }}"
        upper_critical: "{{ threshold_upper_critical | float }}"

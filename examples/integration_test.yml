---
# Integration test playbook for tak_55.raritan_xerus collection
#
# Usage:
#   cp examples/integration_test_vars.yml.example examples/vars.yml
#   vi examples/integration_test_vars.yml   # fill in real credentials
#   ansible-playbook examples/integration_test.yml
#
# Prerequisites: collection must be installed or ANSIBLE_COLLECTIONS_PATH set.
#   pip install -r requirements.txt

- name: Integration tests for tak_55.raritan_xerus modules
  hosts: localhost
  gather_facts: false
  vars_files:
    - integration_test_vars.yml

  tasks:
    # -------------------------------------------------------------------------
    # pdu_config tests
    # -------------------------------------------------------------------------

    - name: "[pdu_config] apply test settings (establish known state)"
      tak_55.raritan_xerus.pdu_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ pdu_name_test }}"
        cycle_delay: "{{ pdu_cycle_delay_test }}"
      register: pdu_apply

    - name: "[pdu_config] check_mode - detect change with different value"
      tak_55.raritan_xerus.pdu_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ pdu_name_check_mode }}"
      check_mode: true
      register: pdu_check

    - name: "[pdu_config] assert check_mode reported a change"
      assert:
        that: pdu_check is changed
        fail_msg: "check_mode should report changed but got: {{ pdu_check }}"

    - name: "[pdu_config] re-apply same settings (idempotency)"
      tak_55.raritan_xerus.pdu_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ pdu_name_test }}"
        cycle_delay: "{{ pdu_cycle_delay_test }}"
      register: pdu_idempotent

    - name: "[pdu_config] assert idempotent (no change on re-apply)"
      assert:
        that: pdu_idempotent is not changed
        fail_msg: "Expected changed=false on re-apply, got: {{ pdu_idempotent }}"

    # -------------------------------------------------------------------------
    # outlet_config tests
    # -------------------------------------------------------------------------

    - name: "[outlet_config] set outlet name"
      tak_55.raritan_xerus.outlet_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        outlet: "{{ test_outlet }}"
        name: "{{ test_outlet_name }}"
      register: outlet_name_set

    - name: "[outlet_config] re-apply same outlet name (idempotency)"
      tak_55.raritan_xerus.outlet_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        outlet: "{{ test_outlet }}"
        name: "{{ test_outlet_name }}"
      register: outlet_name_idempotent

    - name: "[outlet_config] assert outlet name idempotent"
      assert:
        that: outlet_name_idempotent is not changed
        fail_msg: "Expected changed=false on re-apply, got: {{ outlet_name_idempotent }}"

    - name: "[outlet_config] power on"
      tak_55.raritan_xerus.outlet_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        outlet: "{{ test_outlet }}"
        state: on
      register: outlet_on

    - name: "[outlet_config] power on again (idempotency)"
      tak_55.raritan_xerus.outlet_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        outlet: "{{ test_outlet }}"
        state: on
      register: outlet_on_idempotent

    - name: "[outlet_config] assert power on is idempotent"
      assert:
        that: outlet_on_idempotent is not changed
        fail_msg: "Expected changed=false when outlet is already on, got: {{ outlet_on_idempotent }}"

    - name: "[outlet_config] power off"
      tak_55.raritan_xerus.outlet_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        outlet: "{{ test_outlet }}"
        state: off
      register: outlet_off

    - name: "[outlet_config] assert power off changed"
      assert:
        that: outlet_off is changed
        fail_msg: "Expected changed=true when powering off, got: {{ outlet_off }}"

    - name: "[outlet_config] power off again (idempotency)"
      tak_55.raritan_xerus.outlet_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        outlet: "{{ test_outlet }}"
        state: off
      register: outlet_off_idempotent

    - name: "[outlet_config] assert power off is idempotent"
      assert:
        that: outlet_off_idempotent is not changed
        fail_msg: "Expected changed=false when outlet is already off, got: {{ outlet_off_idempotent }}"

    - name: "[outlet_config] restore power on"
      tak_55.raritan_xerus.outlet_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        outlet: "{{ test_outlet }}"
        state: on

    - name: "[outlet_config] power cycle (always changed)"
      tak_55.raritan_xerus.outlet_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        outlet: "{{ test_outlet }}"
        state: cycle
      register: outlet_cycle

    - name: "[outlet_config] assert cycle always reports changed"
      assert:
        that: outlet_cycle is changed
        fail_msg: "Expected changed=true for power cycle, got: {{ outlet_cycle }}"

    # -------------------------------------------------------------------------
    # snmp_config tests
    # -------------------------------------------------------------------------

    - name: "[snmp_config] apply test settings (establish known state)"
      tak_55.raritan_xerus.snmp_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        sys_name: "{{ snmp_sys_name_test }}"
        sys_location: "{{ snmp_sys_location_test }}"
        sys_contact: "{{ snmp_sys_contact_test }}"
        v2_enabled: true
        read_community: "{{ snmp_v2_read_community_test }}"
        write_community: "{{ snmp_v2_write_community_test }}"

    - name: "[snmp_config] check_mode with different value"
      tak_55.raritan_xerus.snmp_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        sys_location: "check_mode only"
      check_mode: true
      register: snmp_check

    - name: "[snmp_config] assert check_mode reported a change"
      assert:
        that: snmp_check is changed
        fail_msg: "check_mode should report changed but got: {{ snmp_check }}"

    - name: "[snmp_config] re-apply same settings (idempotency)"
      tak_55.raritan_xerus.snmp_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        sys_name: "{{ snmp_sys_name_test }}"
        sys_location: "{{ snmp_sys_location_test }}"
        sys_contact: "{{ snmp_sys_contact_test }}"
        v2_enabled: true
        read_community: "{{ snmp_v2_read_community_test }}"
        write_community: "{{ snmp_v2_write_community_test }}"
      register: snmp_idempotent

    - name: "[snmp_config] assert idempotent"
      assert:
        that: snmp_idempotent is not changed
        fail_msg: "Expected changed=false on re-apply, got: {{ snmp_idempotent }}"

    - name: "[snmp_config] change read_community"
      tak_55.raritan_xerus.snmp_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        read_community: "testcommunity"
      register: snmp_community_change

    - name: "[snmp_config] assert community change detected"
      assert:
        that: snmp_community_change is changed
        fail_msg: "Expected changed=true on community change, got: {{ snmp_community_change }}"

    - name: "[snmp_config] restore read_community"
      tak_55.raritan_xerus.snmp_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        read_community: "{{ snmp_v2_read_community_test }}"

    - name: "[snmp_config] enable v3"
      tak_55.raritan_xerus.snmp_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        v3_enabled: true
      register: snmp_v3_enable

    - name: "[snmp_config] assert v3 enabled"
      assert:
        that: snmp_v3_enable is changed
        fail_msg: "Expected changed=true when enabling v3, got: {{ snmp_v3_enable }}"

    - name: "[snmp_config] enable v3 again (idempotency)"
      tak_55.raritan_xerus.snmp_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        v3_enabled: true
      register: snmp_v3_idempotent

    - name: "[snmp_config] assert v3 enable idempotent"
      assert:
        that: snmp_v3_idempotent is not changed
        fail_msg: "Expected changed=false on re-apply, got: {{ snmp_v3_idempotent }}"

    - name: "[snmp_config] restore v3 disabled"
      tak_55.raritan_xerus.snmp_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        v3_enabled: false

    # -------------------------------------------------------------------------
    # syslog_action tests
    # -------------------------------------------------------------------------

    - name: "[syslog_action] absent (pre-clean)"
      tak_55.raritan_xerus.syslog_action:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ syslog_action_name_test }}"
        state: absent

    - name: "[syslog_action] create (state: present)"
      tak_55.raritan_xerus.syslog_action:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ syslog_action_name_test }}"
        server: "{{ syslog_server_test }}"
        port: "{{ syslog_port_test }}"
        state: present
      register: syslog_create

    - name: "[syslog_action] assert created"
      assert:
        that: syslog_create is changed
        fail_msg: "Expected changed=true on create, got: {{ syslog_create }}"

    - name: "[syslog_action] re-apply same settings (idempotency)"
      tak_55.raritan_xerus.syslog_action:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ syslog_action_name_test }}"
        server: "{{ syslog_server_test }}"
        port: "{{ syslog_port_test }}"
        state: present
      register: syslog_idempotent

    - name: "[syslog_action] assert idempotent"
      assert:
        that: syslog_idempotent is not changed
        fail_msg: "Expected changed=false on re-apply, got: {{ syslog_idempotent }}"

    - name: "[syslog_action] update port"
      tak_55.raritan_xerus.syslog_action:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ syslog_action_name_test }}"
        server: "{{ syslog_server_test }}"
        port: 5140
        state: present
      register: syslog_update

    - name: "[syslog_action] assert update changed"
      assert:
        that: syslog_update is changed
        fail_msg: "Expected changed=true on port update, got: {{ syslog_update }}"

    - name: "[syslog_action] delete (state: absent)"
      tak_55.raritan_xerus.syslog_action:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ syslog_action_name_test }}"
        state: absent
      register: syslog_delete

    - name: "[syslog_action] assert deleted"
      assert:
        that: syslog_delete is changed
        fail_msg: "Expected changed=true on delete, got: {{ syslog_delete }}"

    - name: "[syslog_action] absent again (idempotency)"
      tak_55.raritan_xerus.syslog_action:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ syslog_action_name_test }}"
        state: absent
      register: syslog_absent_idempotent

    - name: "[syslog_action] assert absent is idempotent"
      assert:
        that: syslog_absent_idempotent is not changed
        fail_msg: "Expected changed=false when already absent, got: {{ syslog_absent_idempotent }}"

    # -------------------------------------------------------------------------
    # snmp_trap_action tests
    # -------------------------------------------------------------------------

    - name: "[snmp_trap_action] absent (pre-clean)"
      tak_55.raritan_xerus.snmp_trap_action:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ snmp_trap_action_name_test }}"
        state: absent

    - name: "[snmp_trap_action] create"
      tak_55.raritan_xerus.snmp_trap_action:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ snmp_trap_action_name_test }}"
        notification_type: v2Trap
        destinations:
          - host: "{{ snmp_trap_dest_host_test }}"
            port: 162
            community: public
        state: present
      register: snmp_trap_create

    - name: "[snmp_trap_action] assert created"
      assert:
        that: snmp_trap_create is changed
        fail_msg: "Expected changed=true on create, got: {{ snmp_trap_create }}"

    - name: "[snmp_trap_action] re-apply same settings (idempotency)"
      tak_55.raritan_xerus.snmp_trap_action:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ snmp_trap_action_name_test }}"
        notification_type: v2Trap
        destinations:
          - host: "{{ snmp_trap_dest_host_test }}"
            port: 162
            community: public
        state: present
      register: snmp_trap_idempotent

    - name: "[snmp_trap_action] assert idempotent"
      assert:
        that: snmp_trap_idempotent is not changed
        fail_msg: "Expected changed=false on re-apply, got: {{ snmp_trap_idempotent }}"

    - name: "[snmp_trap_action] update destination port"
      tak_55.raritan_xerus.snmp_trap_action:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ snmp_trap_action_name_test }}"
        notification_type: v2Trap
        destinations:
          - host: "{{ snmp_trap_dest_host_test }}"
            port: 1162
            community: public
        state: present
      register: snmp_trap_update

    - name: "[snmp_trap_action] assert update changed"
      assert:
        that: snmp_trap_update is changed
        fail_msg: "Expected changed=true on port update, got: {{ snmp_trap_update }}"

    - name: "[snmp_trap_action] delete (state: absent)"
      tak_55.raritan_xerus.snmp_trap_action:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ snmp_trap_action_name_test }}"
        state: absent
      register: snmp_trap_delete

    - name: "[snmp_trap_action] assert deleted"
      assert:
        that: snmp_trap_delete is changed
        fail_msg: "Expected changed=true on delete, got: {{ snmp_trap_delete }}"

    - name: "[snmp_trap_action] absent again (idempotency)"
      tak_55.raritan_xerus.snmp_trap_action:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ snmp_trap_action_name_test }}"
        state: absent
      register: snmp_trap_absent_idempotent

    - name: "[snmp_trap_action] assert absent is idempotent"
      assert:
        that: snmp_trap_absent_idempotent is not changed
        fail_msg: "Expected changed=false when already absent, got: {{ snmp_trap_absent_idempotent }}"

    - name: "[snmp_trap_action] create with v3Trap"
      tak_55.raritan_xerus.snmp_trap_action:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ snmp_trap_action_name_test }}"
        notification_type: v3Trap
        destinations:
          - host: "{{ snmp_trap_dest_host_test }}"
            port: 162
            community: ""
        state: present
      register: snmp_v3trap_create

    - name: "[snmp_trap_action] assert v3Trap created"
      assert:
        that: snmp_v3trap_create is changed
        fail_msg: "Expected changed=true for v3Trap create, got: {{ snmp_v3trap_create }}"

    - name: "[snmp_trap_action] v3Trap idempotency"
      tak_55.raritan_xerus.snmp_trap_action:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ snmp_trap_action_name_test }}"
        notification_type: v3Trap
        destinations:
          - host: "{{ snmp_trap_dest_host_test }}"
            port: 162
            community: ""
        state: present
      register: snmp_v3trap_idempotent

    - name: "[snmp_trap_action] assert v3Trap idempotent"
      assert:
        that: snmp_v3trap_idempotent is not changed
        fail_msg: "Expected changed=false on re-apply, got: {{ snmp_v3trap_idempotent }}"

    - name: "[snmp_trap_action] switch from v3Trap to v2Inform"
      tak_55.raritan_xerus.snmp_trap_action:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ snmp_trap_action_name_test }}"
        notification_type: v2Inform
        destinations:
          - host: "{{ snmp_trap_dest_host_test }}"
            port: 162
            community: public
        state: present
      register: snmp_v2inform

    - name: "[snmp_trap_action] assert notification_type change detected"
      assert:
        that: snmp_v2inform is changed
        fail_msg: "Expected changed=true when switching notification_type, got: {{ snmp_v2inform }}"

    - name: "[snmp_trap_action] cleanup v3/v2Inform test action"
      tak_55.raritan_xerus.snmp_trap_action:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ snmp_trap_action_name_test }}"
        state: absent

    # -------------------------------------------------------------------------
    # event_rule tests
    # Uses "System Event Log Action" which is a built-in system action
    # -------------------------------------------------------------------------

    - name: "[event_rule] absent (pre-clean)"
      tak_55.raritan_xerus.event_rule:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ event_rule_name_test }}"
        state: absent

    - name: "[event_rule] create"
      tak_55.raritan_xerus.event_rule:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ event_rule_name_test }}"
        action_names:
          - "System Event Log Action"
        event_id: ["**"]
        match_type: both
        enabled: true
        state: present
      register: rule_create

    - name: "[event_rule] assert created"
      assert:
        that: rule_create is changed
        fail_msg: "Expected changed=true on create, got: {{ rule_create }}"

    - name: "[event_rule] re-apply same settings (idempotency)"
      tak_55.raritan_xerus.event_rule:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ event_rule_name_test }}"
        action_names:
          - "System Event Log Action"
        event_id: ["**"]
        match_type: both
        enabled: true
        state: present
      register: rule_idempotent

    - name: "[event_rule] assert idempotent"
      assert:
        that: rule_idempotent is not changed
        fail_msg: "Expected changed=false on re-apply, got: {{ rule_idempotent }}"

    - name: "[event_rule] update enabled=false"
      tak_55.raritan_xerus.event_rule:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ event_rule_name_test }}"
        action_names:
          - "System Event Log Action"
        event_id: ["**"]
        match_type: both
        enabled: false
        state: present
      register: rule_update

    - name: "[event_rule] assert update changed"
      assert:
        that: rule_update is changed
        fail_msg: "Expected changed=true on update, got: {{ rule_update }}"

    - name: "[event_rule] delete (state: absent)"
      tak_55.raritan_xerus.event_rule:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ event_rule_name_test }}"
        state: absent
      register: rule_delete

    - name: "[event_rule] assert deleted"
      assert:
        that: rule_delete is changed
        fail_msg: "Expected changed=true on delete, got: {{ rule_delete }}"

    - name: "[event_rule] absent again (idempotency)"
      tak_55.raritan_xerus.event_rule:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ event_rule_name_test }}"
        state: absent
      register: rule_absent_idempotent

    - name: "[event_rule] assert absent is idempotent"
      assert:
        that: rule_absent_idempotent is not changed
        fail_msg: "Expected changed=false when already absent, got: {{ rule_absent_idempotent }}"

    # -------------------------------------------------------------------------
    # user_account tests
    # -------------------------------------------------------------------------

    - name: "[user_account] pre-clean: delete test user if exists"
      tak_55.raritan_xerus.user_account:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"

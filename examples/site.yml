---
- name: Configure Raritan PDU
  hosts: localhost
  gather_facts: false
  vars:
    pdu_host: "192.168.1.100"
    pdu_user: "admin"
    pdu_pass: "{{ vault_pdu_password }}"

  tasks:
    - name: Set PDU name and cycle delay
      raritan.xerus.pdu_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: false
        name: "Server Room PDU-1"
        cycle_delay: 10

    - name: Configure and power on outlet 1
      raritan.xerus.outlet_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: false
        outlet: 1
        name: "Web Server"
        state: on
        startup_state: on

    - name: Power off outlet 2 (idempotent)
      raritan.xerus.outlet_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: false
        outlet: 2
        state: off

    - name: Cycle outlet 3 (always triggers)
      raritan.xerus.outlet_config:
        host: "{{ pdu_host }}"
        username: "{{ pdu_user }}"
        password: "{{ pdu_pass }}"
        validate_certs: false
        outlet: 3
        state: cycle
